# .github/workflows/audit.yml — RustSec advisory + license/source audit.
#
# RustSec advisories are time-varying: a new advisory can land against an
# unchanged dependency, so this runs on a schedule as well as on every change to
# the dependency set. It also runs on every pull request, so a lockfile bump is
# audited BEFORE it is merged rather than only after it lands on main. No paths
# filter on the PR trigger on purpose: this is a required check, and a filtered
# trigger would never report on a PR that misses the filter, blocking it.
name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
